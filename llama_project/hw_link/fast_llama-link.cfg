debug=false
save-temps=1
temp_dir=fast_llama
report_dir=fast_llama/reports
log_dir=fast_llama/logs
optimize=3

[advanced]
misc=solution_name=fast_llama

[clock]
id=1:fast_forward
id=1:weight

[connectivity]
nk=transformer_cu:1:fast_forward
nk=data_mover_cu:1:weight
sp=fast_forward.m_axi_vc_gemm:DDR_VC
sp=fast_forward.m_axi_kc_gemm:DDR_KC
sp=fast_forward.m_axi_w_n_t_gemm:DDR
stream_connect=weight.Quantized_Data_0:fast_forward.Quantized_Data_0:256
stream_connect=weight.Quantized_Data_1:fast_forward.Quantized_Data_1:256
stream_connect=weight.Scaling_Factor_0:fast_forward.Scaling_Factor_0:32
stream_connect=weight.Scaling_Factor_1:fast_forward.Scaling_Factor_1:32
sp=weight.m_axi_D_W_GEMM_0:DDR_W0
sp=weight.m_axi_D_W_GEMM_1:DDR_W1
noc.read_bw=weight.m_axi_D_W_GEMM_0:11000.64
noc.read_bw=weight.m_axi_D_W_GEMM_1:11000.64
noc.read_bw=fast_forward.m_axi_kc_gemm:2000.16
noc.write_bw=fast_forward.m_axi_kc_gemm:500.16
noc.read_bw=fast_forward.m_axi_vc_gemm:2000.16
noc.write_bw=fast_forward.m_axi_vc_gemm:500.16
noc.read_bw=fast_forward.m_axi_w_n_t_gemm:500.16
noc.write_bw=fast_forward.m_axi_w_n_t_gemm:500.16

[profile]
exec=data_mover_cu:weight:all
data=data_mover_cu:weight:w_0:counters
data=data_mover_cu:weight:w_1:counters
trace_memory=FIFO:8K